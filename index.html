<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Boas Vindas TP</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background: linear-gradient(135deg,#111827,#1f2937,#374151);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      color:white;
    }

    .container{
      width:100%;
      max-width:500px;
      background: rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius:24px;
      padding:40px 30px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.3);
    }

    h1{
      font-size:32px;
      margin-bottom:10px;
    }

    p{
      color:#d1d5db;
      margin-bottom:35px;
      line-height:1.5;
    }

    .buttons{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .btn{
      text-decoration:none;
      padding:16px;
      border-radius:14px;
      font-size:16px;
      font-weight:bold;
      transition:0.3s;
    }

    .btn-form{
      background:#22c55e;
      color:white;
    }

    .btn-form:hover{
      transform:translateY(-2px);
      background:#16a34a;
    }

    .btn-gestor{
      background:#3b82f6;
      color:white;
    }

    .btn-gestor:hover{
      transform:translateY(-2px);
      background:#2563eb;
    }

    .footer{
      margin-top:30px;
      font-size:13px;
      color:#9ca3af;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Boas Vindas TP</h1>

    <p>
      Plataforma de acesso rápido ao formulário
      e painel de gestão.
    </p>

    <div class="buttons">

      <a
        class="btn btn-form"
        href="https://boasvindastp.netlify.app/formulario.html"
        target="_blank"
      >
        Abrir Formulário
      </a>

      <a
        class="btn btn-gestor"
        href="https://boasvindastp.netlify.app/painel_gestor.html"
        target="_blank"
      >
        Abrir Painel do Gestor
      </a>

    </div>

    <div class="footer">
      Desenvolvido para Boas Vindas TP
    </div>

  </div>

</body>
</html>
